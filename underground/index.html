<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺北車站地下連通 3D</title>
<!-- 臺北車站地下連通 3D（示意）：北門站→京站、往北到中山站與雙連站。資料與來源見 data.js。
     可切換樓層、勾選區域；出口與樓梯用自訂的全區唯一編號，右側列表與 data.js 的 check() 逐層比對。 -->
<style>
  :root { --ink:#1F3A3D; }
  html,body{margin:0;height:100%;background:#EEF1EE;overflow:hidden;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink)}
  #title{position:absolute;left:300px;top:14px;pointer-events:none}
  #title h1{margin:0;font-size:26px;letter-spacing:.05em} #title p{margin:4px 0 0;font-size:13px;opacity:.75}
  .panel{position:absolute;top:12px;bottom:12px;width:270px;background:rgba(255,255,255,.93);border-radius:10px;padding:12px 14px;box-sizing:border-box;overflow:auto;font-size:13px}
  #left{left:12px} #right{right:12px;width:330px}
  h2{font-size:14px;margin:12px 0 6px} h2:first-child{margin-top:0}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  button{border:1px solid #9DB3B5;background:#fff;color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px}
  button.on{background:#2A6369;color:#fff;border-color:#2A6369}
  label{display:block;line-height:1.9;cursor:pointer} label i{display:inline-block;width:12px;height:12px;border-radius:2px;margin:0 6px 0 4px;vertical-align:-1px}
  table{border-collapse:collapse;width:100%} td,th{padding:3px 4px;border-bottom:1px solid #E3E8E8;text-align:left;vertical-align:top} th{font-size:12px;color:#5A6B6D}
  td.id{font-weight:700;white-space:nowrap} .ap{color:#A0672A} .ok{color:#2A7A4A;font-weight:700} .bad{color:#B3362B;font-weight:700}
  #note{position:absolute;left:300px;bottom:12px;font-size:11px;color:#5A6B6D;max-width:calc(100% - 330px)}
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<div id="title"><h1>臺北車站地下連通</h1><p>西起北門站、東到京站與臺北轉運站、北到中山站與雙連站（示意）</p></div>
<div class="panel" id="left">
  <h2>樓層（可複選）</h2><div class="btns" id="floors"></div>
  <h2>顯示區域</h2><div class="btns"><button id="gall">全選</button><button id="gnone">全不選</button></div><div id="groups"></div>
  <h2>標示</h2>
  <label><input type="checkbox" id="showE" checked> 出口</label><label><input type="checkbox" id="showS" checked> 樓梯／電扶梯</label>
  <label><input type="checkbox" id="showZ" checked> 區域名稱</label><label><input type="checkbox" id="showG" checked> 地面道路</label>
  <h2>視角</h2><div class="btns" id="views"></div>
</div>
<div class="panel" id="right" style="display:none"><div id="list"></div></div>
<button id="tgl" style="position:absolute;right:12px;top:12px;z-index:5">顯示清單</button>
<div id="note">示意模型：平面依臺北市觀光傳播局地下街詳細地圖，樓層依捷運各站剖面圖；深度 ×4 垂直誇張。樓梯、電扶梯是斜的（一層水平約 12 m），灰色直柱是電梯；紫色短梯是同層高差（K 區比臺鐵 B1 低半層，Z 區再低四分之一層）。Y 區深度同 B2。橘色字＝位置或上行方向為估計。中山站、雙連站位置為外推。</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./lib/OrbitControls.js";
import { SCALE, ORIGIN, LEVELS, LEVEL_NAME, GROUPS, ZONES, EXITS, STAIRS, STEPS, ROADS, STATION, TRACKS, zonesAt, dzAt, check } from "./data.js";

const X = x => (x - ORIGIN[0]) * SCALE, Zc = y => (y - ORIGIN[1]) * SCALE;
const VS = 4, DEPTH = { G: 0, B1: -7, B2: -14, B3: -21, B4: -28 }, yOf = l => DEPTH[l] * VS, SLAB = 10;
const GCOL = Object.fromEntries(GROUPS.map(g => [g[0], g[2]])), GNAME = Object.fromEntries(GROUPS.map(g => [g[0], g[1]]));
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight); renderer.setClearColor(0xEEF1EE); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 12000), ctl = new OrbitControls(cam, renderer.domElement);
ctl.enableDamping = true; scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa5a0, 1.2)); const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(-400, 900, -300); scene.add(sun);
const objs = [];   // {o, kind, group, levels}
const reg = (o, kind, group, levels) => { scene.add(o); objs.push({ o, kind, group, levels }); return o; };
function label(text, size, color, bg = "rgba(255,255,255,.85)") {
  const c = document.createElement("canvas"), g = c.getContext("2d"), f = `700 ${size * 2}px "Microsoft JhengHei","Segoe UI"`;
  g.font = f; c.width = g.measureText(text).width + 28; c.height = size * 2 + 18; g.font = f;
  g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, c.width, c.height, 10); g.fill(); g.fillStyle = color; g.textBaseline = "middle"; g.fillText(text, 14, c.height / 2 + 1);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })); s.scale.set(c.width * .16, c.height * .16, 1); s.renderOrder = 10; return s;
}
function slab(w, d, col, op) { const m = _slab(w, d, col, op); m.userData.op = op; return m; }
function _slab(w, d, col, op) { return new THREE.Mesh(new THREE.BoxGeometry(w, SLAB, d), new THREE.MeshStandardMaterial({ color: col, roughness: .8, transparent: true, opacity: op })); }
// 區域
for (const z of ZONES) {
  const col = z.color || GCOL[z.group], op = z.parking ? .3 : .9, y = yOf(z.level) + SLAB / 2 + (z.lift || 0) + (z.dz || 0) * VS; let cx, cz;
  if (z.poly) { const sh = new THREE.Shape(z.poly.map(([a, b]) => new THREE.Vector2(X(a), Zc(b)))); const geo = new THREE.ExtrudeGeometry(sh, { depth: SLAB, bevelEnabled: false }); geo.rotateX(Math.PI / 2);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: z.parking ? "#A8B2B8" : col, roughness: .8, transparent: true, opacity: op })); m.userData.op = op; m.position.y = y + SLAB / 2; reg(m, "zone", z.group, [z.level]);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x33434a, transparent: true, opacity: .4 })); e.userData.op = .4; e.position.y = y + SLAB / 2; reg(e, "zone", z.group, [z.level]);
    const L = z.lab || [z.poly.reduce((t, q) => t + q[0], 0) / z.poly.length, z.poly.reduce((t, q) => t + q[1], 0) / z.poly.length]; cx = X(L[0]); cz = Zc(L[1]); }
  else if (z.rect) { const [a, b, c, d] = z.rect; const m = slab((c - a) * SCALE, (d - b) * SCALE, z.parking ? "#A8B2B8" : col, op); cx = X((a + c) / 2); cz = Zc((b + d) / 2); m.position.set(cx, y, cz); reg(m, "zone", z.group, [z.level]);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x33434a, transparent: true, opacity: .4 })); e.userData.op = .4; e.position.copy(m.position); reg(e, "zone", z.group, [z.level]); }
  else { for (let i = 0; i < z.path.length - 1; i++) { const [a, b] = z.path[i], [c, d] = z.path[i + 1]; const len = Math.hypot(c - a, d - b) * SCALE + z.w * SCALE * .5;
      const m = slab(len, z.w * SCALE, col, op); m.position.set(X((a + c) / 2), y, Zc((b + d) / 2)); m.rotation.y = -Math.atan2(d - b, c - a); reg(m, "zone", z.group, [z.level]); }
    const k = Math.floor(z.path.length / 2) - 1; cx = X(z.path[k][0]); cz = Zc(z.path[k][1]); }
  if (!z.id.includes("-A1") && !/^Y-T|BM-B1a|T-B1w/.test(z.id)) { const s = label(z.name, 15, "#1F3A3D"); s.position.set(cx, y + 16, cz); reg(s, "zlabel", z.group, [z.level]); }
}
// 軌道：兩條並行的細長方塊，依每個點的深度連起來
for (const tr of TRACKS) for (let i = 0; i < tr.pts.length - 1; i++) { const [a, b, da] = tr.pts[i], [c, d, db] = tr.pts[i + 1];
  const A = new THREE.Vector3(X(a), da * VS + 3, Zc(b)), B = new THREE.Vector3(X(c), db * VS + 3, Zc(d)), len = A.distanceTo(B);
  const m = new THREE.Mesh(new THREE.BoxGeometry(9, 3, len + 4), new THREE.MeshStandardMaterial({ color: tr.color })); m.position.copy(A.clone().add(B).multiplyScalar(.5)); m.lookAt(B); reg(m, "track", tr.group, tr.levels); }
{ const s = label("淡水信義線", 14, "#fff", "rgba(200,49,47,.95)"); s.position.set(X(1830), -17 * VS + 16, Zc(-150)); reg(s, "zlabel", "RL", ["B2", "B3", "B4"]); }
// 斜梯：從上層樓板面的 A 點斜到下層樓板面的 B 點，兩端各一小塊平台
function ramp(ax, az, ay, bx, bz, by, col, w, kind, group, levels) {
  const A = new THREE.Vector3(X(ax), ay, Zc(az)), B = new THREE.Vector3(X(bx), by, Zc(bz)), len = A.distanceTo(B), mat = new THREE.MeshStandardMaterial({ color: col, roughness: .6 });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.4, len), mat); m.position.copy(A.clone().add(B).multiplyScalar(.5)); m.lookAt(B); reg(m, kind, group, levels);
  const n = Math.max(3, Math.round(len / 3.2)), dark = new THREE.MeshStandardMaterial({ color: new THREE.Color(col).multiplyScalar(.62) });   // 踏階：一階一階的橫條
  for (let i = 1; i < n; i++) { const t = new THREE.Mesh(new THREE.BoxGeometry(w + .6, .5, .7), dark); t.position.copy(A.clone().lerp(B, i / n)); t.position.y += .9; t.rotation.y = Math.atan2(B.x - A.x, B.z - A.z); reg(t, kind, group, levels); }
  for (const P of [A, B]) { const d = new THREE.Mesh(new THREE.BoxGeometry(w + 1.5, 1, w + 1.5), mat); d.position.copy(P); reg(d, kind, group, levels); }
}
// 出口：黃色。有樓梯資料的畫成斜梯（B1 梯腳 → 地面梯頂），其餘（電梯、沒有圖示、位置估計）直上直下
const B1TOP = yOf("B1") + SLAB;
for (const e of EXITS) {
  let tx = e.x, ty = e.y; const base = yOf(e.level) + SLAB + dzAt(e.level, e.x, e.y) * VS, LV = ["G", e.level];
  if (e.ramps) { for (const [fx, fy, gx, gy] of e.ramps) ramp(gx, gy, .5, fx, fy, base + .5, 0xF2C200, 4, "exit", e.group, LV); [, , tx, ty] = e.ramps[0]; }
  else { const h = -base; const p = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, h, 8), new THREE.MeshStandardMaterial({ color: 0xF2C200 })); p.position.set(X(e.x), base + h / 2, Zc(e.y)); reg(p, "exit", e.group, LV); }
  for (const [gx, gy] of e.ramps ? e.ramps.map(r => [r[2], r[3]]) : [[tx, ty]]) { const g = new THREE.Mesh(new THREE.BoxGeometry(7, 3, 7), new THREE.MeshStandardMaterial({ color: 0xF2C200 })); g.position.set(X(gx), 1.5, Zc(gy)); reg(g, "exit", e.group, LV); }   // 地面的出入口
  const s = label(e.id, 12, e.approx || e.dirApprox ? "#A0672A" : "#1A1A1A", "rgba(255,220,60,.95)"); s.position.set(X(tx), 10, Zc(ty)); reg(s, "exit", e.group, LV);
}
// 樓梯／電扶梯：青色斜梯，逐層從上層落點斜到下層落點；電梯是直的
for (const st of STAIRS) {
  const L = st.levels, top = l => (l === "G" ? 0 : yOf(l) + SLAB + dzAt(l, ...st.pts[l]) * VS) + .5; let lp;
  if (st.elev) { const a = top(L[0]), b = top(L[L.length - 1]), [x, y] = st.pts[L[0]]; const p = new THREE.Mesh(new THREE.BoxGeometry(4, a - b, 4), new THREE.MeshStandardMaterial({ color: 0x7A8C96 })); p.position.set(X(x), (a + b) / 2, Zc(y)); reg(p, "stair", st.group, L); lp = [X(x) + 5, (a + b) / 2, Zc(y)]; }
  else { for (let i = 0; i < L.length - 1; i++) { const [ax, ay] = st.pts[L[i]], [bx, by] = st.pts[L[i + 1]]; ramp(ax, ay, top(L[i]), bx, by, top(L[i + 1]), 0x3BB4DA, 4.5, "stair", st.group, L); }
    const [ax, ay] = st.pts[L[0]], [bx, by] = st.pts[L[1]]; lp = [X((ax + bx) / 2) + 5, (top(L[0]) + top(L[1])) / 2 + 4, Zc((ay + by) / 2)]; }
  const s = label(st.id, 12, "#fff", st.elev ? "rgba(90,105,115,.95)" : st.approx ? "rgba(160,103,42,.95)" : "rgba(26,120,150,.95)"); s.position.set(...lp); reg(s, "stair", st.group, L);
}
// 同層高差：同在 B1、樓板不一樣高的兩區之間的短梯（紫色）
for (const h of STEPS) { const ya = B1TOP + dzAt("B1", h.x, h.y) * VS + .5, yb = B1TOP + dzAt("B1", h.x2, h.y2) * VS + .5;
  ramp(h.x, h.y, ya, h.x2, h.y2, yb, 0x8E5BD0, 5, "stair", h.group, ["B1"]);
  const s = label(h.id, 12, "#fff", h.approx ? "rgba(160,103,42,.95)" : "rgba(120,70,190,.95)"); s.position.set(X(h.x) + 5, ya + 6, Zc(h.y)); reg(s, "stair", h.group, ["B1"]); }
// 地面
const ground = [];
for (const [nm, pts] of ROADS) { for (let i = 0; i < pts.length - 1; i++) { const a = new THREE.Vector3(X(pts[i][0]), .3, Zc(pts[i][1])), b = new THREE.Vector3(X(pts[i + 1][0]), .3, Zc(pts[i + 1][1])), d = b.clone().sub(a);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(d.length(), 16), new THREE.MeshBasicMaterial({ color: 0xC4CACC, transparent: true, opacity: .55, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.rotation.z = -Math.atan2(d.z, d.x); m.position.copy(a.add(d.multiplyScalar(.5))); scene.add(m); ground.push(m); }
  const s = label(nm, 12, "#55656A", "rgba(255,255,255,.6)"), e = pts[0]; s.position.set(X(e[0]), 6, Zc(e[1])); scene.add(s); ground.push(s); }
{ const [a, b, c, d] = STATION; const m = new THREE.Mesh(new THREE.BoxGeometry((c - a) * SCALE, 30, (d - b) * SCALE), new THREE.MeshStandardMaterial({ color: 0xE9E2D2, transparent: true, opacity: .3, depthWrite: false })); m.position.set(X((a + c) / 2), 15, Zc((b + d) / 2)); scene.add(m); ground.push(m);
  const s = label("臺北車站（地面）", 14, "#55656A"); s.position.set(X((a + c) / 2), 40, Zc((b + d) / 2)); scene.add(s); ground.push(s); }

// ── 狀態與介面
const state = { floors: new Set(LEVELS), groups: new Set(GROUPS.map(g => g[0])) };
const CHK = check(); window.CHECK = { issues: CHK.issues, perLevel: CHK.perLevel };
const $ = id => document.getElementById(id);
for (const f of ["ALL", ...LEVELS]) { const b = document.createElement("button"); b.textContent = f === "ALL" ? "全部" : LEVEL_NAME[f]; b.dataset.f = f; b.onclick = () => { if (f === "ALL") state.floors = new Set(state.floors.size === LEVELS.length ? [] : LEVELS); else state.floors.has(f) ? state.floors.delete(f) : state.floors.add(f); apply(); }; $("floors").appendChild(b); }
for (const [id, nm, col] of GROUPS) { const l = document.createElement("label"); l.innerHTML = `<input type="checkbox" checked data-g="${id}"><i style="background:${col}"></i>${nm}`; l.firstChild.onchange = e => { e.target.checked ? state.groups.add(id) : state.groups.delete(id); apply(); }; $("groups").appendChild(l); }
$("gall").onclick = () => { GROUPS.forEach(g => state.groups.add(g[0])); sync(); }; $("gnone").onclick = () => { state.groups.clear(); sync(); };
function sync() { document.querySelectorAll("[data-g]").forEach(c => c.checked = state.groups.has(c.dataset.g)); apply(); }
for (const id of ["showE", "showS", "showZ", "showG"]) $(id).onchange = apply;
$("tgl").onclick = () => { const r = $("right"), on = r.style.display === "none"; r.style.display = on ? "" : "none"; r.style.top = "50px"; $("tgl").textContent = on ? "關閉清單" : "顯示清單"; };   // 右側清單預設關閉（使用者 2026-11-28）
const zname = (lv, x, y) => (zonesAt(lv, x, y, 16)[0] || {}).name || "—";
function apply() {
  const F = state.floors, all = F.size === LEVELS.length, ghost = F.has("G") && !F.has("B1");   // 樓層可複選；選了地面沒選 B1 時，B1 淡淡墊在下面當參照
  document.querySelectorAll("#floors button").forEach(b => b.classList.toggle("on", b.dataset.f === "ALL" ? all : F.has(b.dataset.f)));
  for (const { o, kind, group, levels } of objs) {
    let v = state.groups.has(group) && levels.some(l => F.has(l));
    if (kind === "exit") v = v && $("showE").checked; if (kind === "stair") v = v && $("showS").checked; if (kind === "zlabel") v = v && $("showZ").checked;
    const gh = kind === "zone" && F.has("G") && ((levels.includes("B1") && !F.has("B1")) || (group === "Y" && !F.has("B2"))); if (gh) v = state.groups.has(group);
    if (kind === "zone" && o.material) o.material.opacity = gh ? .18 : o.userData.op;
    o.visible = v;
  }
  ground.forEach(g => g.visible = $("showG").checked && (F.has("G") || F.has("B1")));
  // 右側列表：這一層、這些區域的出口與樓梯
  const lv = F.size === 1 ? [...F][0] : null, G = state.groups;
  const zs = ZONES.filter(z => G.has(z.group) && F.has(z.level));
  const ex = EXITS.filter(e => G.has(e.group) && (F.has("G") || F.has(e.level)));
  const st = STAIRS.filter(s => G.has(s.group) && s.levels.some(l => F.has(l)));
  const iss = CHK.issues;
  let h = `<h2>${all ? "全部樓層" : LEVELS.filter(l => F.has(l)).map(l => LEVEL_NAME[l]).join("＋") || "未選樓層"}：${zs.length} 個區域、${ex.length} 個出口、${st.length} 座樓梯</h2>`;
  h += `<div>逐層比對：${iss.length ? `<span class="bad">${iss.length} 個問題</span><br>` + iss.join("<br>") : `<span class="ok">通過</span>（每個出口、每座樓梯的每一層都落在區域內；所有區域都能從出口走到；編號不重複）`}</div>`;
  h += `<h2>區域</h2><table>` + zs.filter(z => !z.parking).map(z => `<tr><td class="id">${z.level}</td><td>${z.name}</td><td>${GNAME[z.group]}</td></tr>`).join("") + `</table>`;
  h += `<h2>樓梯／電扶梯</h2><table><tr><th>編號</th><th>連接</th><th>所在區域${lv && lv !== "G" ? "（本層）" : ""}</th></tr>` + st.map(s => `<tr><td class="id ${s.approx ? "ap" : ""}">${s.id}</td><td>${s.levels.map(l => LEVEL_NAME[l]).join("–")}</td><td>${lv && lv !== "G" ? zname(lv, ...s.pts[lv]) : s.note}</td></tr>`).join("") + `</table>`;
  if (F.has("B1")) h += `<h2>同層高差（B1 內）</h2><div>K 區比臺鐵 B1 低半層（約 2 m），Z 區與捷運連通層再低四分之一層（約 1 m）。</div><table>` + STEPS.filter(x => G.has(x.group)).map(x => `<tr><td class="id ${x.approx ? "ap" : ""}">${x.id}</td><td>${x.note}</td></tr>`).join("") + `</table>`;
  if (lv === "G") h = h.replace("</h2>", "</h2><div>地面層：所有有編號的出入口都在這一層（黃色方塊）；下方淡色是 B1 的範圍。</div>");
  if (ex.length) h += `<h2>出口（通往地面）</h2><table><tr><th>編號</th><th>梯腳所在區域</th><th>通往</th></tr>` + ex.map(e => `<tr><td class="id ${e.approx ? "ap" : ""}">${e.id}</td><td>${zname(e.level, e.x, e.y)}</td><td>${e.to}</td></tr>`).join("") + `</table>`;
  $("list").innerHTML = h;
}
const VIEWS = { "樓梯近看": [[300, 230, 620], [300, -60, 110]], "K／Z 高差": [[150, 150, 520], [160, -40, 100]], "總覽": [[60, 1900, 1750], [60, -40, -380]], "車站核心": [[250, 520, 650], [250, -60, 60]], "北門—A1": [[-380, 420, 520], [-330, -50, -40]],
  "中山地下街": [[1150, 700, -150], [520, -30, -500]], "剖面（從南看）": [[150, -40, 1500], [150, -60, 0]], "正上方": [[250, 2300, -249], [250, 0, -250]] };
window.setView = n => { const [p, t] = VIEWS[n]; cam.position.set(...p); ctl.target.set(...t); ctl.update(); };
window.setFloor = f => { state.floors = new Set(f === "ALL" ? LEVELS : [].concat(f)); apply(); }; window.setGroups = a => { state.groups = new Set(a); sync(); };
for (const k in VIEWS) { const b = document.createElement("button"); b.textContent = k; b.onclick = () => setView(k); $("views").appendChild(b); }
setView("總覽"); apply();
addEventListener("resize", () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() { ctl.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })();
window.READY = true;
</script>
